# Hyperdown 每日自动签到（邮箱列表在单个 Secret 里，单 job 依次签完）。保活见 keepalive.yml。
name: Hyperdown Check-in

on:
  workflow_dispatch:
  schedule:
    # UTC 00:05 ≈ 北京 08:05
    - cron: "5 0 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run check-in for all accounts
        env:
          EMAILS: ${{ secrets.HYPERDOWN_EMAILS }}
          HYPERDOWN_PASSWORD: ${{ secrets.HYPERDOWN_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "$EMAILS" ]; then echo "::error::HYPERDOWN_EMAILS 为空：请确认已创建该 Secret"; exit 1; fi
          if [ -z "$HYPERDOWN_PASSWORD" ]; then echo "::error::HYPERDOWN_PASSWORD 为空"; exit 1; fi

          total=0; ok=0; failed=0
          {
            echo "## Hyperdown 签到结果"
            echo ""
            echo "| 账号 | 结果 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do
            # 只留邮箱本身：去掉空白及可能误带的引号、逗号、中括号
            email=$(printf '%s' "$line" | tr -d '][:space:]",[')
            if [ -z "$email" ]; then continue; fi
            total=$((total+1))
            echo "===== [$total] $email ====="
            if HYPERDOWN_EMAIL="$email" python checkin.py; then
              ok=$((ok+1))
              echo "| $email | 成功 |" >> "$GITHUB_STEP_SUMMARY"
            else
              code=$?
              failed=$((failed+1))
              echo "::error::账号 $email 签到失败 (exit $code)"
              echo "| $email | 失败 (exit $code) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            sleep 2
          done <<< "$EMAILS"

          echo "===== 汇总: 共 $total 个，成功 $ok，失败 $failed ====="
          echo "汇总：共 $total 个账号，成功 $ok，失败 $failed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ] || [ "$failed" -ne 0 ]; then exit 1; fi
