# Hyperdown 每日自动签到（邮箱列表在单个 Secret 里）。保活见 keepalive.yml。
name: Hyperdown Check-in

on:
  workflow_dispatch:
  schedule:
    # UTC 00:05 ≈ 北京 08:05
    - cron: "5 0 * * *"

permissions:
  contents: read

jobs:
  # 搬运工：从 Secret 读出邮箱列表，传给 checkin（matrix 里不能直接用 secrets 上下文）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      emails: ${{ steps.read.outputs.emails }}
    steps:
      - id: read
        env:
          EMAILS: ${{ secrets.HYPERDOWN_EMAILS }}
        run: |
          if [ -z "$EMAILS" ]; then
            echo "::error::HYPERDOWN_EMAILS 为空：请确认已创建该 Secret 且内容非空"
            exit 1
          fi
          # 多行值必须用 key<<分隔符 的 heredoc 写法
          {
            echo "emails<<ENDOFEMAILS"
            printf '%s\n' "$EMAILS"
            echo "ENDOFEMAILS"
          } >> "$GITHUB_OUTPUT"

  checkin:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        email: ${{ fromJSON(needs.prepare.outputs.emails) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run check-in (${{ matrix.email }})
        env:
          HYPERDOWN_EMAIL: ${{ matrix.email }}
          HYPERDOWN_PASSWORD: ${{ secrets.HYPERDOWN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HYPERDOWN_EMAIL:-}" ] || [ -z "${HYPERDOWN_PASSWORD:-}" ]; then
            echo "::error::缺少 Secrets：请配置 HYPERDOWN_EMAILS 与 HYPERDOWN_PASSWORD"
            exit 1
          fi
          python checkin.py
